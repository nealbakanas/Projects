    { id: "cosmos", t: "Cosmos", a: "Carl Sagan", why: "The original, and still the most inspiring." }
  ]},
  { name: "6 · Math as play", blurb: "Math as something curious and fun, not homework.", books: [
    { id: "joy-x", t: "The Joy of x", a: "Steven Strogatz", why: "Short chapters from counting to calculus." },
    { id: "fourth-dim", t: "Things to Make and Do in the Fourth Dimension", a: "Matt Parker", why: "Hands-on math you can do at the kitchen table." },
    { id: "humble-pi", t: "Humble Pi", a: "Matt Parker", why: "What happens when math goes wrong in the real world. Very funny." }
  ]},
  { name: "7 · The big picture & being a curious parent", blurb: "Everything tied together, plus how small kids actually learn.", books: [
    { id: "short-history", t: "A Short History of Nearly Everything", a: "Bill Bryson", why: "A tour of all of science. A perfect capstone." },
    { id: "scientist-crib", t: "The Scientist in the Crib", a: "Gopnik, Meltzoff & Kuhl", why: "How babies learn. Your kid is already doing experiments." },
    { id: "what-if", t: "What If?", a: "Randall Munroe", why: "Absurd questions answered with real science. Good practice for toddler-grade questions." }
  ]}

/* ---------- storage (per-device, optional) ---------- */
const SYNC_KEYS = new Set(["wf.saved", "wf.seen", "wf.books", "wf.sr", "wf.today", "wf.guess"]);
let progressRef = null, writeTimer = null, writing = false, writeAgain = false;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  raw(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  set(k, v) {
    store.raw(k, v);
    if (SYNC_KEYS.has(k)) { lastWrite = Date.now(); store.raw("wf.updatedAt", lastWrite); scheduleSync(); }
  }
};
let lastWrite = store.get("wf.updatedAt", 0);
const todayKey = new Date().toISOString().slice(0, 10);
let saved = new Set(store.get("wf.saved", []));
let seen = new Set(store.get("wf.seen", []));
let booksRead = new Set(store.get("wf.books", []));
let today = store.get("wf.today", { date: todayKey, ids: [] });
if (today.date !== todayKey) today = { date: todayKey, ids: [] };
let guessFirst = store.get("wf.guess", false);

const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));
const $ = s => document.querySelector(s);

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const paras = arr => arr.map(p => `<p>${p}</p>`).join("");

/* ---------- spaced repetition ---------- */
// Leitner boxes: each correct recall moves a card up a box and pushes its next review further out.
const DAY = 86400000;
const INTERVALS = [1, 3, 7, 16, 35, 90];
let sr = store.get("wf.sr", {});
for (const id of seen) if (!sr[id] && byId[id]) sr[id] = { box: 0, due: Date.now() };
store.set("wf.sr", sr);
const recallShown = new Set();

function scheduleNew(id) {
  if (sr[id]) return;
  sr[id] = { box: 0, due: Date.now() + DAY };
  store.set("wf.sr", sr);
}
function dueIds() {
  const now = Date.now();
  return Object.keys(sr).filter(id => byId[id] && sr[id].due <= now).sort((a, b) => sr[a].due - sr[b].due);
}
const daysLabel = n => n === 1 ? "tomorrow" : `in ${n} days`;

/* ---------- flags (shared db so Claude can read them) ---------- */
const REASONS = ["Seems wrong", "Unclear", "Too long", "Kid answer doesn't land", "Needs a source"];
let db = null;
let flags = {};
let localFlags = store.get("wf.flagsLocal", {});
/* ---------- sync: each person's progress lives in their private db doc, so it follows them across devices and Claude can read it ---------- */
function progressState() {
  return { saved: [...saved], seen: [...seen], books: [...booksRead], sr, today, guess: guessFirst, updatedAt: lastWrite };
}
function scheduleSync() {
  if (!progressRef) return;
  clearTimeout(writeTimer);
  writeTimer = setTimeout(flushSync, 1500);
}
async function flushSync() {
  if (!progressRef) return;
  if (writing) { writeAgain = true; return; }
  writing = true;
  try { await progressRef.set(progressState()); } catch (e) {}
  writing = false;
  if (writeAgain) { writeAgain = false; flushSync(); }
}
addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && writeTimer) { clearTimeout(writeTimer); writeTimer = null; flushSync(); } });

function applyRemote(r) {
  const remoteNewer = (r.updatedAt || 0) > lastWrite;
  (r.seen || []).forEach(id => seen.add(id));
  for (const [id, e] of Object.entries(r.sr || {})) if (!sr[id] || e.due > sr[id].due) sr[id] = e;
  if (r.today && r.today.date === todayKey) today.ids = [...new Set([...today.ids, ...r.today.ids])];
  const guessBefore = guessFirst;
  if (remoteNewer) {
    saved = new Set(r.saved || []);
    booksRead = new Set(r.books || []);
    guessFirst = !!r.guess;
    lastWrite = r.updatedAt;
    store.raw("wf.updatedAt", lastWrite);
  }
  store.raw("wf.seen", [...seen]); store.raw("wf.sr", sr); store.raw("wf.today", today);
  store.raw("wf.saved", [...saved]); store.raw("wf.books", [...booksRead]); store.raw("wf.guess", guessFirst);
  renderToday(); renderSavedCount(); renderFilters();
  document.querySelectorAll("[data-save]").forEach(b => {
    const on = saved.has(b.dataset.save);
    b.setAttribute("aria-pressed", on);
    const label = b.querySelector("span"); if (label) label.textContent = on ? "Saved" : "Save";
  });
  if (!$("#view-saved").hidden) renderSaved();
  if (!$("#view-books").hidden) renderBooks();
  if (guessBefore !== guessFirst) resetFeed();
  return remoteNewer;
}

(async () => {
  if (!window.claude || !window.claude.use) return;
  let user = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { db = null; }
  if (!db) return;
  db.collection("flags").onSnapshot(snap => {
    flags = {};
    snap.docs.forEach(d => { flags[d.id] = d.data(); });
    refreshFlagButtons();
  }, () => {});
  const uid = user ? await user.id() : null;
  if (!uid) return;
  const ref = db.doc("data/users/" + uid + "/progress");
  try {
    const snap = await ref.get();
    progressRef = ref;
    if (snap.exists) applyRemote(snap.data());
    scheduleSync();
  } catch (e) { return; }
  ref.onSnapshot(snap => {
    if (snap.exists && !snap.metadata.hasPendingWrites && (snap.data().updatedAt || 0) > lastWrite) applyRemote(snap.data());
  }, () => {});
})();
function isFlagged(id) {
  return (flags[id] && flags[id].status === "open") || !!localFlags[id];
}
function refreshFlagButtons() {
  document.querySelectorAll("[data-flag]").forEach(b => {
    const on = isFlagged(b.dataset.flag);
    b.setAttribute("aria-pressed", on);
    b.textContent = on ? "Flagged" : "Flag a problem";
  });
}

const BOOKMARK = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z" stroke-linejoin="round"/></svg>`;

function sourcesHTML(c) {
  const topic = WIKI[c.id];
  const flagged = isFlagged(c.id);
  return `<div class="meta-row">
      ${topic ? `<span class="label">Go deeper</span>
      <a href="${wikiUrl("en", topic)}" target="_blank" rel="noopener">Wikipedia ↗</a>
      <a href="${wikiUrl("simple", topic)}" target="_blank" rel="noopener">Simple English ↗</a>` : ""}
      <button class="flag-btn" data-flag="${c.id}" aria-pressed="${flagged}">${flagged ? "Flagged" : "Flag a problem"}</button>
    </div>
    <div class="flag-slot"></div>`;
}

function cardHTML(c, first) {
  const nx = c.next && byId[c.next];
  const on = saved.has(c.id);
  return `<article class="card" data-id="${c.id}" style="--cat:var(--c-${c.cat})">
    <div class="card-inner">
      <div class="card-top">
        <span class="chip"><i></i>${CATS[c.cat]}</span>
        <button class="save" data-save="${c.id}" aria-pressed="${on}">${BOOKMARK}<span>${on ? "Saved" : "Save"}</span></button>
      </div>
      <h2 class="q">${c.q}</h2>
      ${guessFirst ? `<button class="unveil" data-unveil>Guess out loud first, then tap to reveal</button>` : ""}
      <ol class="ladder${guessFirst ? " veiled" : ""}">
        <li class="rung"><span class="rung-label">Rung 1 · Say it to a 4-year-old</span><p class="kid">${c.kid}</p></li>
        <li class="rung"><span class="rung-label">Rung 2 · How it really works</span>${paras(c.how)}</li>
        ${c.try ? `<li class="rung"><span class="rung-label">Rung 3 · Try it together</span><p>${c.try}</p></li>` : ""}
      </ol>
      ${c.fact ? `<p class="fact"><b>Dinner-table fact.</b> ${c.fact}</p>` : ""}
      ${sourcesHTML(c)}
      ${nx ? `<button class="next" data-next="${nx.id}"><div><small>But why…?</small><span>${nx.q}</span></div><span class="arrow" aria-hidden="true">↓</span></button>` : ""}
    </div>
    ${first ? `<div class="hint" aria-hidden="true">Scroll for the next why</div>` : ""}
  </article>`;
}

function recallHTML(c) {
  const s = sr[c.id] || { box: 0 };
  const good = INTERVALS[Math.min(s.box + 1, INTERVALS.length - 1)];
  return `<article class="card recall" data-recall="${c.id}" style="--cat:var(--c-${c.cat})">
    <div class="card-inner">
      <div class="card-top">
        <span class="chip"><i></i>Quick recall · ${CATS[c.cat]}</span>
        <span class="level">Level ${s.box + 1} of ${INTERVALS.length}</span>
      </div>
      <h2 class="q">${c.q}</h2>
      <p class="prompt">Your kid just asked this. Say the 4-year-old answer out loud. Then explain the real mechanism in your head, as if they asked "but why?"</p>
      <button class="unveil reveal" data-reveal>Reveal the answer</button>
      <ol class="ladder" hidden>
        <li class="rung"><span class="rung-label">Rung 1 · Say it to a 4-year-old</span><p class="kid">${c.kid}</p></li>
        <li class="rung"><span class="rung-label">Rung 2 · How it really works</span>${paras(c.how)}</li>
      </ol>
      <div class="grade" hidden>
        <button data-grade="again"><b>Fuzzy</b><small>See it again tomorrow</small></button>
        <button data-grade="good"><b>Nailed it</b><small>Next review ${daysLabel(good)}</small></button>
      </div>
    </div>
  </article>`;
}

/* ---------- feed ---------- */
const feed = $("#feed");
let filter = "all";
let queue = [];
let round = 0;
let sinceRecall = 0;

function pool() { return CARDS.filter(c => filter === "all" || filter === "review" || c.cat === filter); }
function refill() {
  if (filter === "review") {
    if (round === 0) queue.push(...dueIds().map(id => ({ recall: id })));
    queue.push({ caughtUp: true });
    round++;
    return;
  }
  const p = pool();
  const fresh = shuffle(p.filter(c => !seen.has(c.id)));
  const old = shuffle(p.filter(c => seen.has(c.id)));
  if (round > 0) queue.push({ interstitial: true, n: p.length });
  queue.push(...fresh, ...old);
  round++;
}
function nextRecall() {
  return dueIds().find(id => !recallShown.has(id) && (filter === "all" || byId[id].cat === filter));
}
let feedDone = false;
function appendBatch(n = 8) {
  if (feedDone) return;
  let html = "";
  for (let i = 0; i < n; i++) {
    if (filter !== "review" && sinceRecall >= 4) {
      const r = nextRecall();
      if (r) { recallShown.add(r); sinceRecall = 0; html += recallHTML(byId[r]); continue; }
    }
    if (!queue.length) refill();
    const item = queue.shift();
    if (item.caughtUp) {
      html += `<article class="card interstitial" style="--cat:var(--accent)"><div class="card-inner">
        <span class="chip"><i></i>All caught up</span>
        <h2>Nothing else is due for review.</h2>
        <p>Cards come back here on a schedule: tomorrow, then 3 days, 7, 16, 35 and 90, each time you nail one. Head back to the feed for new questions.</p>
        <button class="btn primary" data-filter-go="all">Back to the feed</button>
      </div></article>`;
      feedDone = true;
      break;
    } else if (item.recall) {
      recallShown.add(item.recall);
      html += recallHTML(byId[item.recall]);
    } else if (item.interstitial) {
      html += `<article class="card interstitial" style="--cat:var(--accent)"><div class="card-inner">
        <span class="chip"><i></i>Round complete</span>
        <h2>You've climbed all ${item.n} ladders${filter === "all" ? "" : " in " + CATS[filter]}.</h2>
        <p>The feed starts over in a new order. Seeing a card again is how it sticks, so try saying rung 1 out loud before you read it.</p>
      </div></article>`;
    } else {
      sinceRecall++;
      html += cardHTML(item, feed.children.length === 0 && html === "");
    }
  }
  feed.insertAdjacentHTML("beforeend", html);
  observeCards();
}
function resetFeed() {
  feed.innerHTML = ""; queue = []; round = 0; sinceRecall = 0; feedDone = false;
  recallShown.clear();
  feed.scrollTop = 0;
  appendBatch();
}

const seenObs = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    const id = e.target.dataset.id;
    if (id) {
      seen.add(id); store.set("wf.seen", [...seen]);
      scheduleNew(id);
      if (!today.ids.includes(id)) { today.ids.push(id); store.set("wf.today", today); renderToday(); }
    }
    if (e.target === feed.lastElementChild || e.target === feed.children[feed.children.length - 3]) appendBatch();
  }
}, { root: feed, threshold: 0.6 });
function observeCards() { for (const el of feed.children) if (!el.dataset.obs) { el.dataset.obs = 1; seenObs.observe(el); } }

function renderToday() {
  const due = dueIds().length;
  $("#today").textContent = `${today.ids.length} today · ${seen.size}/${CARDS.length} explored${due ? ` · ${due} due` : ""}`;
}

function openFlagForm(card, id) {
  const slot = card.querySelector(".flag-slot");
  if (slot.firstChild) { slot.innerHTML = ""; return; }
  const prior = (flags[id] && flags[id].status === "open") || localFlags[id];
  slot.innerHTML = `<form class="flag-form" data-flag-form="${id}">
    <span class="why">${prior ? "Already flagged. Add another note?" : "What's off about this card?"}</span>
    <div class="reasons">${REASONS.map(r => `<button type="button" data-reason="${r}" aria-pressed="false">${r}</button>`).join("")}</div>
    <textarea id="flag-note-${id}" placeholder="Optional: what's wrong, or what you'd say instead"></textarea>
    <div class="actions"><button class="btn primary" type="submit">Send flag</button><button class="btn" type="button" data-flag-cancel>Cancel</button><span class="status" role="status"></span></div>
  </form>`;
}

async function submitFlag(form) {
  const id = form.dataset.flagForm;
  const reasons = [...form.querySelectorAll('[data-reason][aria-pressed="true"]')].map(b => b.dataset.reason);
  const text = form.querySelector("textarea").value.trim();
  const status = form.querySelector(".status");
  if (!reasons.length && !text) { status.textContent = "Pick a reason or write a note first."; return; }
  const note = { reasons, text, at: new Date().toISOString() };
  const btn = form.querySelector('[type="submit"]');
  btn.disabled = true;
  if (db) {
    const prev = flags[id] && flags[id].status === "open" ? (flags[id].notes || []) : [];
    try {
      await db.doc("flags/" + id).set({ cardId: id, q: byId[id].q, status: "open", notes: [...prev, note], updatedAt: note.at });
      flags[id] = { status: "open", notes: [...prev, note] };
      status.textContent = "Sent. Ask Claude to review your flags and it can fix the card.";
    } catch (e) {
      btn.disabled = false;
      status.textContent = e && e.code === "quota_exceeded" ? "The flag list is full. Ask Claude to clear resolved flags." : "Couldn't send the flag. Check your connection and try again.";
      return;
    }
  } else {
    localFlags[id] = [...(localFlags[id] || []), note];
    store.set("wf.flagsLocal", localFlags);
    status.textContent = "Saved on this device only. Open the app on claude.ai to send flags to Claude.";
  }
  refreshFlagButtons();
  setTimeout(() => { const slot = form.parentElement; if (slot) slot.innerHTML = ""; }, 2200);
}

feed.addEventListener("submit", e => {
  const form = e.target.closest("[data-flag-form]");
  if (form) { e.preventDefault(); submitFlag(form); }
});

feed.addEventListener("click", e => {
  const s = e.target.closest("[data-save]");
  if (s) { toggleSave(s.dataset.save); return; }
  const fl = e.target.closest("[data-flag]");
  if (fl) { openFlagForm(fl.closest(".card"), fl.dataset.flag); return; }
  const rs = e.target.closest("[data-reason]");
  if (rs) { rs.setAttribute("aria-pressed", rs.getAttribute("aria-pressed") !== "true"); return; }
  const fc = e.target.closest("[data-flag-cancel]");
  if (fc) { fc.closest(".flag-slot").innerHTML = ""; return; }
  const uv = e.target.closest("[data-unveil]");
  if (uv) { uv.closest(".card").querySelector(".ladder").classList.remove("veiled"); uv.remove(); return; }
  const rv = e.target.closest("[data-reveal]");
  if (rv) {
    const card = rv.closest(".card");
    card.querySelector(".ladder").hidden = false;
    card.querySelector(".grade").hidden = false;
    rv.remove();
    return;
  }
  const gr = e.target.closest("[data-grade]");
  if (gr) {
    const card = gr.closest(".card");
    const id = card.dataset.recall;
    const s = sr[id] || { box: 0 };
    let days;
    if (gr.dataset.grade === "good") { s.box = Math.min(s.box + 1, INTERVALS.length - 1); days = INTERVALS[s.box]; }
    else { s.box = 0; days = 1; }
    s.due = Date.now() + days * DAY;
    sr[id] = s; store.set("wf.sr", sr);
    card.querySelector(".grade").outerHTML = `<p class="graded">${gr.dataset.grade === "good" ? "Nice." : "No problem, it'll be back."} Next review ${daysLabel(days)}.</p>`;
    renderToday(); renderFilters();
    return;
  }
  const go = e.target.closest("[data-filter-go]");
  if (go) { setFilter(go.dataset.filterGo); return; }
  const n = e.target.closest("[data-next]");
  if (n) {
    const card = n.closest(".card");
    const nextId = n.dataset.next;
    let target = card.nextElementSibling;
    if (!target || target.dataset.id !== nextId) {
      card.insertAdjacentHTML("afterend", cardHTML(byId[nextId], false));
      target = card.nextElementSibling;
      observeCards();
    }
    const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    feed.scrollTo({ top: target.offsetTop - feed.offsetTop, behavior: smooth ? "smooth" : "auto" });
  }
});

function toggleSave(id) {
  saved.has(id) ? saved.delete(id) : saved.add(id);
  store.set("wf.saved", [...saved]);
  document.querySelectorAll(`[data-save="${id}"]`).forEach(b => {
    const on = saved.has(id);
    b.setAttribute("aria-pressed", on);
    const label = b.querySelector("span"); if (label) label.textContent = on ? "Saved" : "Save";
  });
  renderSavedCount();
  if (!$("#view-saved").hidden) renderSaved();
}

/* ---------- filters ---------- */
function renderFilters() {
  const due = dueIds().length;
  const opts = [["all", "Everything"], ...Object.entries(CATS)];
  $("#filters").innerHTML =
    `<button class="practice" data-filter="review" aria-pressed="${filter === "review"}">Review<span class="due-n">${due ? " · " + due : ""}</span></button>
     <button class="practice" data-guess aria-pressed="${guessFirst}">Guess first</button>
     <span class="sep" aria-hidden="true"></span>` +
    opts.map(([k, label]) =>
      `<button data-filter="${k}" aria-pressed="${filter === k}" ${k === "all" ? "" : `style="--cat:var(--c-${k})"`}>${k === "all" ? "" : "<i></i>"}${label}</button>`
    ).join("");
}
function setFilter(f) {
  filter = f;
  if (f !== "review") store.set("wf.filter", f);
  renderFilters(); resetFeed();
}
$("#filters").addEventListener("click", e => {
  if (e.target.closest("[data-guess]")) {
    guessFirst = !guessFirst; store.set("wf.guess", guessFirst);
    renderFilters(); resetFeed();
    return;
  }
  const b = e.target.closest("[data-filter]"); if (!b) return;
  setFilter(b.dataset.filter);
});

/* ---------- saved ---------- */
function renderSavedCount() { $("#savedCount").textContent = saved.size ? saved.size : ""; }
function renderSaved() {
  const items = [...saved].map(id => byId[id]).filter(Boolean);
  $("#savedList").innerHTML = `<div><h2>Saved questions</h2><p class="lede">Cards you bookmarked to come back to. Tap one to open it.</p></div>` +
    (items.length ? items.map(c => `<details class="saved-item" style="--cat:var(--c-${c.cat})">
      <summary><span class="dot"></span><strong>${c.q}</strong></summary>
      <div class="body"><p><b>${c.kid}</b></p>${paras(c.how)}${c.try ? `<p><b>Try it:</b> ${c.try}</p>` : ""}
      <button class="remove" data-save="${c.id}">Remove from saved</button></div>
    </details>`).join("") : `<div class="empty">Nothing saved yet. Tap <b>Save</b> on any card in the feed and it will show up here.</div>`);
}
$("#savedList").addEventListener("click", e => { const s = e.target.closest("[data-save]"); if (s) toggleSave(s.dataset.save); });

/* ---------- books ---------- */
function renderBooks() {
  const all = STAGES.flatMap(s => s.books);
  const done = all.filter(b => booksRead.has(b.id)).length;
  $("#bookList").innerHTML = `<div><h2>Reading path</h2><p class="lede">${all.length} readable books, roughly in the order to work through them. If you only read three, read the ones marked start here. Tick books off as you finish them.</p></div>
    <div class="progress"><div class="bar"><i style="width:${(done / all.length) * 100}%"></i></div><span>${done} of ${all.length} read</span></div>` +
    STAGES.map(s => `<section class="stage"><h3>${s.name}</h3><p>${s.blurb}</p>${s.books.map(b => `
      <label class="book${booksRead.has(b.id) ? " done" : ""}" for="bk-${b.id}">
        <input type="checkbox" id="bk-${b.id}" data-book="${b.id}" ${booksRead.has(b.id) ? "checked" : ""}>
        <div class="info"><span class="title">${b.t}</span>${b.start ? `<span class="badge">Start here</span>` : ""}<br><span class="author">${b.a}</span><p class="why">${b.why}</p></div>
      </label>`).join("")}</section>`).join("");
}
$("#bookList").addEventListener("change", e => {
  const id = e.target.dataset.book; if (!id) return;
  e.target.checked ? booksRead.add(id) : booksRead.delete(id);
  store.set("wf.books", [...booksRead]);
  const y = $("#view-books .list").scrollTop;
  renderBooks();
  $("#view-books .list").scrollTop = y;
});

/* ---------- views ---------- */
const VIEWS = ["feed", "saved", "books"];
function show(view) {
  if (!VIEWS.includes(view)) view = "feed";
  for (const v of VIEWS) {
    $("#view-" + v).hidden = v !== view;
    const t = $("#tab-" + v);
    v === view ? t.setAttribute("aria-current", "page") : t.removeAttribute("aria-current");
  }
  if (view === "saved") renderSaved();
  if (view === "books") renderBooks();
}
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-view]"); if (!b) return;
  location.hash = b.dataset.view;
  show(b.dataset.view);
});
addEventListener("hashchange", () => show(location.hash.slice(1)));

addEventListener("keydown", e => {
  if ($("#view-feed").hidden || e.target.closest("input, textarea")) return;
  if (["ArrowDown", "j", "PageDown"].includes(e.key) || ["ArrowUp", "k", "PageUp"].includes(e.key)) {
    e.preventDefault();
    const dir = ["ArrowDown", "j", "PageDown"].includes(e.key) ? 1 : -1;
    feed.scrollBy({ top: dir * feed.clientHeight, behavior: "smooth" });
  }
});

/* ---------- boot ---------- */
const savedFilter = store.get("wf.filter", "all");
filter = savedFilter === "all" || CATS[savedFilter] ? savedFilter : "all";
renderFilters();
renderSavedCount();
renderToday();
resetFeed();
show(location.hash.slice(1));
</script>
